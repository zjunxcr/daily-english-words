name: Daily English Words

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Prepare git config
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git checkout main

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Generate daily words
      run: |
        python generate-today-words.py || true
        git add memory.md || true
        git commit -m "Update: $(date)" || true
        git push || true

    - name: Embed audio
      run: python embed-daily-words-audio.py || true

    - name: Send notifications
      run: python send-all-v2.py
      env:
        SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}

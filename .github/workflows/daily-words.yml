name: Daily English Words

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - run: pip install -r requirements.txt
    - run: python generate-today-words.py
    - run: python embed-daily-words-audio.py
    - run: python send-all-v2.py
      env:
        SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}

name: Daily English Words

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # 日期校验：只有今天才执行，防止 GitHub 延迟触发导致重复
    - name: Check date
      run: |
        TODAY=$(date -u +%Y-%m-%d)
        echo "Today is: $TODAY"
        if [ -n "$TARGET_DATE" ] && [ "$TARGET_DATE" != "$TODAY" ]; then
          echo "Date mismatch, skipping..."
          exit 78
        fi
      env:
        TARGET_DATE: ${{ github.event.inputs.target_date || '' }}

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - run: pip install -r requirements.txt
    - run: python generate-today-words.py
    - run: python embed-daily-words-audio.py
    - run: python send-all-v2.py
      env:
        SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
